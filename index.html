<section id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-brand">
      <img src="/icons/icon-192.png" alt="" class="login-logo" />
      <div>
        <h1 class="login-title">Seju</h1>
        <p class="login-sub">Acesso restrito</p>
      </div>
    </div>

    <form id="login-form" class="form" autocomplete="on">
      <div class="field">
        <label class="field-label" for="login-user">Usuário</label>
        <input class="field-input" id="login-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
      </div>
      <div class="field">
        <label class="field-label" for="login-password">Senha</label>
        <div class="password-wrap">
          <input class="field-input" id="login-password" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="btn-toggle-pass" aria-label="Mostrar senha">
            <svg class="ic"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>

    <div class="login-divider"><span>ou</span></div>

    <button id="btn-login" class="btn btn-secondary btn-block login-github" type="button">
      <svg class="ic"><use href="#i-github"/></svg>
      <span>Entrar com GitHub</span>
    </button>
  </div>
</section>

<div id="app" class="app" hidden>

  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-head">
      <img src="/icons/icon-192.png" alt="" class="sidebar-logo" />
      <div class="sidebar-id">
        <div class="sidebar-brand">Seju</div>
        <div class="sidebar-user" id="sidebar-user">-</div>
      </div>
      <button id="btn-sidebar-collapse" class="icon-btn sidebar-collapse" aria-label="Recolher menu">
        <svg class="ic"><use href="#i-chevron-left"/></svg>
      </button>
      <button id="btn-sidebar-close" class="icon-btn sidebar-close" aria-label="Fechar">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <div class="sidebar-foot">
      <button id="btn-theme" class="sidebar-action" aria-label="Alternar tema">
        <svg class="ic sidebar-theme-icon"><use href="#i-moon"/></svg>
        <span class="sidebar-theme-label">Tema escuro</span>
      </button>
      <button id="btn-sync" class="sidebar-action" aria-label="Atualizar">
        <svg class="ic"><use href="#i-refresh"/></svg>
        <span>Atualizar</span>
      </button>
      <button id="btn-logout" class="sidebar-action sidebar-action-danger" aria-label="Sair">
        <svg class="ic"><use href="#i-logout"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <div id="scrim" class="scrim" hidden></div>

  <main class="content">
    <div class="mobile-header">
      <button id="btn-menu" class="icon-btn" aria-label="Menu">
        <svg class="ic"><use href="#i-menu"/></svg>
      </button>
      <div class="mobile-title">Seju</div>
      <button id="btn-theme-mobile" class="icon-btn" aria-label="Alternar tema">
        <svg class="ic sidebar-theme-icon"><use href="#i-moon"/></svg>
      </button>
      <button id="btn-sync-mobile" class="icon-btn" aria-label="Atualizar">
        <svg class="ic"><use href="#i-refresh"/></svg>
      </button>
    </div>
    <div id="view" class="view" tabindex="-1"></div>
  </main>

</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>
<div id="modal-host" class="modal-host" hidden></div>
<div id="confirm-host" class="modal-host" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
